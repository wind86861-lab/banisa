<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banisa — Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      background: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* === Animated network loader === */
    .banisa-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .banisa-loader svg {
      width: 160px;
      height: 160px;
    }

    .banisa-loader .seg {
      transform-origin: 80px 80px;
      animation: netblink 1.8s ease-in-out infinite;
    }

    .banisa-loader .seg:nth-child(1) {
      animation-delay: 0s
    }

    .banisa-loader .seg:nth-child(2) {
      animation-delay: 0.18s
    }

    .banisa-loader .seg:nth-child(3) {
      animation-delay: 0.36s
    }

    .banisa-loader .seg:nth-child(4) {
      animation-delay: 0.54s
    }

    .banisa-loader .seg:nth-child(5) {
      animation-delay: 0.72s
    }

    .banisa-loader .seg:nth-child(6) {
      animation-delay: 0.9s
    }

    @keyframes netblink {

      0%,
      60%,
      100% {
        opacity: 0.18
      }

      30% {
        opacity: 1
      }
    }

    .banisa-loader .core {
      transform-origin: 80px 80px;
      animation: corepulse 2s ease-in-out infinite;
    }

    @keyframes corepulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.06)
      }
    }

    .banisa-loader .label {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: labelFade 1.2s ease-in-out infinite alternate;
    }

    @keyframes labelFade {
      from {
        opacity: 0.35
      }

      to {
        opacity: 1
      }
    }
  </style>
</head>

<body>

  <div class="banisa-loader">
    <svg viewBox="0 0 160 160">
      <!-- 6 segments: line + outer node, blinking in sequence -->
      <g class="seg">
        <line x1="80" y1="80" x2="80" y2="20" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
        <circle cx="80" cy="20" r="9" fill="#2dd4bf" />
      </g>
      <g class="seg">
        <line x1="80" y1="80" x2="131.96" y2="50" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" />
        <circle cx="131.96" cy="50" r="6.5" fill="#14b8a6" />
      </g>
      <g class="seg">
        <line x1="80" y1="80" x2="131.96" y2="110" stroke="#0d9488" stroke-width="2" stroke-linecap="round" />
        <circle cx="131.96" cy="110" r="6.5" fill="#0d9488" />
      </g>
      <g class="seg">
        <line x1="80" y1="80" x2="80" y2="140" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" />
        <circle cx="80" cy="140" r="6.5" fill="#14b8a6" />
      </g>
      <g class="seg">
        <line x1="80" y1="80" x2="28.04" y2="110" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
        <circle cx="28.04" cy="110" r="6.5" fill="#2dd4bf" />
      </g>
      <g class="seg">
        <line x1="80" y1="80" x2="28.04" y2="50" stroke="#5eead4" stroke-width="2" stroke-linecap="round" />
        <circle cx="28.04" cy="50" r="6.5" fill="#5eead4" />
      </g>
      <!-- Core -->
      <g class="core">
        <circle cx="80" cy="80" r="24" fill="#0d9488" />
        <text x="80" y="80" text-anchor="middle" dominant-baseline="central" font-family="Plus Jakarta Sans,system-ui"
          font-weight="800" font-size="30" fill="#fff">B</text>
      </g>
    </svg>
    <div class="label">Yuklanmoqda</div>
  </div>

</body>

</html>
